apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres,namespace: settle}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports: [{containerPort: 5432}]
        env:
        - {name: POSTGRES_DB,value: settle}
        - {name: POSTGRES_USER,value: settle}
        - {name: POSTGRES_PASSWORD,value: settle-local-only}
        args: ["-c","max_connections=100","-c","log_min_duration_statement=1000"]
        resources: {requests: {cpu: 100m,memory: 256Mi},limits: {cpu: 500m,memory: 512Mi}}
        volumeMounts: [{name: pgdata,mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
  - metadata: {name: pgdata}
    spec: {accessModes: [ReadWriteOnce],resources: {requests: {storage: 2Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres,namespace: settle}
spec: {selector: {app: postgres},ports: [{port: 5432,targetPort: 5432}]}
