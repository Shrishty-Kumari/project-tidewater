apiVersion: apps/v1
kind: Deployment
metadata: {name: settle-worker,namespace: settle}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: {type: RollingUpdate,rollingUpdate: {maxUnavailable: 0,maxSurge: 1}}
  selector: {matchLabels: {app: settle-worker}}
  template:
    metadata: {labels: {app: settle-worker}}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: worker
        image: settle-api:1.9.0
        imagePullPolicy: IfNotPresent
        command: [python,worker/main.py]
        ports: [{containerPort: 9100}]
        envFrom: [{configMapRef: {name: settle-config}}]
        securityContext: {allowPrivilegeEscalation: false,readOnlyRootFilesystem: true,capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 100m,memory: 128Mi},limits: {cpu: 300m,memory: 256Mi}}
