events {}
http {
 log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","request":"$request","status":$status,"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
 access_log /var/log/nginx/access.log json;
 server { listen 8080; location / { proxy_pass http://settle-api.settle.svc.cluster.local:80; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Real-IP $remote_addr; proxy_connect_timeout 5s; proxy_send_timeout 30s; proxy_read_timeout 30s; } }
}
